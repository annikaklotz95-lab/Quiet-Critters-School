<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiet Critters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&family=Andika:wght@400;700&family=Fredoka:wght@500;700&family=Patrick+Hand&family=Caveat:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Merriweather:wght@400;700&display=swap">
<style id="pageStyle"></style>
<style>
/* Layout: the painted habitat fills the screen; two calm floating bars (top: habitat + tools, bottom: status + meter) and nothing else. Panels share one surface, one radius, no borders. */
:root{
  --surface: rgba(17, 23, 21, .78);
  --surface-solid: #161e1b;
  --raise: #1f2925;
  --raise-2: #27332e;
  --hair: rgba(255,255,255,.08);
  --ink: #f5f1e3;
  --muted: #a9b6ae;
  --calm: #5fd6b4;
  --close: #ffc65c;
  --loud: #ff8068;
  --sun: #ffd86b;
  --common: #9fd9a8;
  --uncommon: #8cc5ff;
  --rare: #ffcf5c;
  --r: 16px;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0e1513;color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
svg.art{display:block;overflow:visible}
svg.ic{width:18px;height:18px;flex:none}

#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
#critters{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#haze{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;background-color:var(--haze,#ccc);background-size:180px 180px}
#haze.static{animation:static .18s steps(3) infinite}
@keyframes static{0%{background-position:0 0}33%{background-position:-60px 40px}66%{background-position:50px -70px}100%{background-position:0 0}}

/* ---------- floating bars ---------- */
.surface{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:var(--r);box-shadow:0 8px 28px rgba(0,0,0,.18)}
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;pointer-events:none;
  padding-top:max(14px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .5s}
.topbar > *{pointer-events:auto}
.bar{display:flex;align-items:center;gap:4px;padding:5px}
.logo{font-family:var(--display);font-weight:800;font-size:19px;padding:0 10px 0 10px;white-space:nowrap;line-height:1}
.sep{width:1px;height:26px;background:var(--hair)}
.habbtn{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:12px;padding:4px 10px 4px 6px;text-align:left}
.habbtn:hover{background:rgba(255,255,255,.06)}
.habbtn .hab-ic{width:40px;height:34px;display:grid;place-items:center}
.habbtn .hab-ic svg{width:40px;height:34px}
.habbtn b{display:block;font-weight:800;font-size:15px;line-height:1.15}
.habbtn small{display:block;color:var(--muted);font-weight:700;font-size:12px;line-height:1.2}
.ib{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;color:var(--ink);white-space:nowrap}
.ib:hover{background:rgba(255,255,255,.07)}
.ib.sq{padding:8px 9px}
.ib small{color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}

.pop{position:fixed;z-index:35;top:calc(max(14px,env(safe-area-inset-top,0px)) + 62px);left:max(16px,env(safe-area-inset-left,0px));width:min(640px,calc(100% - 32px));max-height:calc(100% - 100px);overflow:auto;padding:12px;background:var(--surface-solid);border-radius:var(--r);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.pop h3{margin:2px 4px 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.habgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.habtile{border:0;border-radius:12px;background:var(--raise);padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.habtile:hover:not(:disabled){background:var(--raise-2)}
.habtile .pic{background:var(--tint);height:58px;display:grid;place-items:center}
.habtile .pic svg.art{width:60px;height:50px}
.habtile .meta{padding:7px 10px 9px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.habtile b{font-weight:800;font-size:14px}
.habtile small{color:var(--muted);font-weight:800;font-size:12px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.habtile[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.habtile:disabled .pic{filter:grayscale(1) brightness(.55)}
.habtile:disabled .pic svg.art{filter:brightness(0) opacity(.35)}
.habtile .hint{padding:0 10px 9px;color:var(--muted);font-size:11.5px;font-weight:700;line-height:1.3}
.pop .note{margin:10px 4px 2px}

.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding-bottom:max(14px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock{pointer-events:auto;max-width:1060px;margin:0 auto;padding:12px 14px 12px 12px;display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr) auto auto;gap:20px;align-items:center;position:relative}
.dockToggle{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;padding:0;margin-left:-8px}
.dockToggle:hover{background:var(--raise);color:var(--ink)}
.dockToggle .ic{width:20px;height:20px;transition:transform .2s}
.bottombar.min .dock{display:flex;width:max-content;margin:0;padding:6px 8px 6px 6px;gap:6px;cursor:pointer}
.bottombar.min .meter,.bottombar.min #listenBtn,.bottombar.min .status-text{display:none}
.bottombar.min .ring{width:44px;height:44px}
.bottombar.min .ring .mini{inset:9px 6px}
.bottombar.min .ring .mini svg{width:32px;height:27px}
.bottombar.min .dockToggle{margin-left:0}
.bottombar.min .dockToggle .ic{transform:rotate(180deg)}
.status{display:flex;align-items:center;gap:12px;min-width:0}
.ring{width:58px;height:58px;flex:none;position:relative}
.ring > svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:rgba(255,255,255,.1)}
.ring .fg{stroke:var(--calm);transition:stroke .3s}
.ring .mini{position:absolute;inset:12px 8px;display:grid;place-items:center}
.ring .mini svg{width:42px;height:35px}
.status-text{min-width:0}
.status-text strong{display:block;font-family:var(--display);font-weight:800;font-size:clamp(18px,1.6vw,22px);line-height:1.1}
.status-text span{display:block;color:var(--muted);font-weight:700;font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.meter{min-width:0}
.meter-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.presets{display:flex;gap:2px;background:rgba(255,255,255,.05);border-radius:999px;padding:2px;transition:opacity .5s}
.presets button{border:0;background:transparent;border-radius:999px;padding:3px 11px;font-weight:800;font-size:12px;color:var(--muted)}
.presets button[aria-pressed="true"]{background:var(--ink);color:#16201c}
.meter-head b{font-family:var(--display);font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.track{position:relative;height:22px;border-radius:11px;background:rgba(255,255,255,.07);touch-action:none;cursor:pointer}
.track .zone{position:absolute;top:0;bottom:0;right:0;border-radius:0 11px 11px 0;background:repeating-linear-gradient(-45deg,rgba(255,128,104,.16) 0 7px,rgba(255,128,104,.06) 7px 14px)}
.track .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:11px;background:var(--calm);transition:background .25s}
.track .goal{position:absolute;top:-6px;bottom:-6px;width:0;border-left:3px solid var(--ink);border-radius:2px}
.track .goal::before{content:"";position:absolute;left:-8.5px;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.5)}
.test-row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;font-weight:800;color:var(--close)}
.test-row input{flex:1;accent-color:var(--close)}
@media (max-width:860px){.dock{grid-template-columns:1fr;gap:10px}.dockToggle{position:absolute;top:8px;right:8px}.logo,.sep{display:none}.ib span{display:none}}

body.idle .topbar{opacity:0;pointer-events:none}
body.idle .topbar > *{pointer-events:none}
body.idle .presets{opacity:0}
body.idle{cursor:none}
body.nonum #levelNum{visibility:hidden}

/* ---------- buttons ---------- */
.btn{border:0;background:var(--raise-2);border-radius:12px;padding:9px 16px;font-weight:800;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#31403a}
.btn.primary{background:var(--sun);color:#1d1606}
.btn.primary:hover{background:#ffe48f}
.btn.big{padding:12px 20px;font-size:15px}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:rgba(255,255,255,.06)}
.btn.danger{color:var(--loud)}
.btn:disabled{opacity:.4}

/* ---------- critters ---------- */
.critter svg{overflow:visible}
.critter{position:absolute;transform:translate(-50%,-100%);line-height:1;transition:opacity .9s ease-in .25s}
.critter.flee{transition:left 1.15s cubic-bezier(.55,0,.9,.45),opacity .9s ease-in .25s}
.critter .pose{transform-origin:50% 100%;animation:arrive 2.8s cubic-bezier(.2,.7,.2,1) both}
.critter .sprite{display:block;transform-origin:50% 100%;position:relative}
.critter .glyph{display:block;position:relative;transform:scaleX(var(--flip,1));transition:transform .7s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 .03em .03em rgba(0,0,0,.28))}
.critter .glyph > svg{width:1.5em;height:1.25em}
.critter .baby{position:absolute;left:82%;bottom:0;animation:arrive 2.4s ease-out both}
.critter .baby svg{width:.78em;height:.65em}
.critter.glow .glyph{filter:drop-shadow(0 0 .08em rgba(190,205,255,.75))}
.critter.night .glyph{filter:drop-shadow(0 0 .05em rgba(255,236,200,.55)) drop-shadow(0 .03em .03em rgba(0,0,0,.3))}
.critter.golden .glyph{filter:sepia(1) saturate(3.2) hue-rotate(-10deg) brightness(1.12) drop-shadow(0 0 .12em rgba(255,214,90,.95))}
.critter.stand .sprite{animation:breathe 3.6s ease-in-out infinite}
.critter.swim .sprite,.critter.fly .sprite{animation:none;transform-origin:50% 60%;will-change:transform}
.critter.settled .sprite{animation-duration:7s}
.critter.moving.stand .sprite{animation:none}
.critter.settled.stand .sprite{animation-name:doze}
.critter .zz{position:absolute;right:8%;top:-4%;font-family:var(--display);font-weight:800;font-size:.16em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);opacity:0;pointer-events:none}
.critter.settled.stand:not(.alert) .zz{animation:zz 3.2s ease-in-out infinite}
.critter .halo{position:absolute;left:-15%;right:-15%;top:-10%;bottom:-5%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,236,150,.55),rgba(255,214,110,.22) 55%,rgba(255,214,110,0));animation:halo 3.2s ease-in-out infinite;pointer-events:none}
.critter .sparks{position:absolute;inset:-10% -10% 0;pointer-events:none;z-index:2}
.critter .sparks i{position:absolute;width:calc(.16em * var(--s));height:calc(.16em * var(--s));margin:calc(-.08em * var(--s));animation:twinkle 2.4s ease-in-out infinite;background:radial-gradient(circle,#fff 0 18%,rgba(255,240,170,.9) 19% 30%,transparent 31%),linear-gradient(#fff6c8,#fff6c8) center/12% 100% no-repeat,linear-gradient(#fff6c8,#fff6c8) center/100% 12% no-repeat;filter:drop-shadow(0 0 .04em #ffe9a0)}
.critter.rare .glyph{filter:drop-shadow(0 0 .05em rgba(255,230,140,.9)) drop-shadow(0 .03em .03em rgba(0,0,0,.25))}
@keyframes halo{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.2) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}60%{opacity:.9;transform:scale(.9) rotate(60deg)}}
.critter.stand::after{content:"";position:absolute;left:18%;right:18%;bottom:-.02em;height:.1em;border-radius:50%;background:rgba(0,0,0,.2);filter:blur(2px);z-index:-1}
.critter.alert .sprite{animation:perk .38s ease-in-out infinite alternate}
.critter.flee{opacity:0}
.critter.flee .pose{animation:hop .3s ease-out both}
.critter.fizz{transition:opacity 1.1s steps(6)}
.critter.flee.fizz .pose{animation:fizz .12s steps(2) infinite}
body.paused .critter .sprite,body.paused .critter .pose{animation-play-state:paused!important}
.critter .tag{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);font-family:var(--body);font-weight:800;font-size:max(12px,.13em);white-space:nowrap;background:rgba(17,23,21,.82);color:var(--ink);padding:2px 9px;border-radius:8px;opacity:0;animation:tag 4.5s ease 1.4s both}
@keyframes arrive{0%{opacity:0;transform:translateY(22%) scale(.72)}35%{opacity:.35}100%{opacity:1;transform:none}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.03)}}
@keyframes doze{0%,100%{transform:translateY(3%) scale(1.02,.93)}50%{transform:translateY(3%) scale(1.03,.95)}}
@keyframes swim{0%,100%{transform:translateX(-.15em) rotate(-2deg)}50%{transform:translateX(.15em) rotate(2deg)}}
@keyframes walk{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-1%) rotate(-.7deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-1%) rotate(.7deg)}}
@keyframes flyby{0%,100%{transform:translateY(-.04em) rotate(-1deg)}50%{transform:translateY(.04em) rotate(1deg)}}
@keyframes hover{0%,100%{transform:translateY(-.07em)}50%{transform:translateY(.07em)}}
@keyframes perk{from{transform:translateY(0) rotate(0)}to{transform:translateY(-5%) rotate(-3deg)}}
@keyframes hop{0%{transform:none}50%{transform:translateY(-18%) scale(1.05)}100%{transform:translateY(0)}}
@keyframes fizz{0%{transform:translateX(-.04em) skewX(8deg);filter:blur(1px)}100%{transform:translateX(.04em) skewX(-8deg);filter:none}}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.8)}30%{opacity:.9}100%{opacity:0;transform:translate(.4em,-.6em) scale(1.3)}}
@keyframes tag{0%{opacity:0;transform:translate(-50%,6px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* ---------- toasts ---------- */
#toasts{position:fixed;top:max(84px,calc(env(safe-area-inset-top,0px) + 84px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:30;pointer-events:none;width:min(540px,calc(100% - 32px))}
.toast{background:var(--surface-solid);border-radius:var(--r);padding:8px 18px 8px 8px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 32px rgba(0,0,0,.35);animation:toast 5.5s ease both}
.toast .pic{width:80px;height:62px;border-radius:11px;background:var(--tint,#2a3532);display:grid;place-items:center;flex:none}
.toast .pic svg{width:72px;height:58px}
.toast strong{font-family:var(--display);font-size:19px;display:block;line-height:1.15}
.toast span{color:var(--muted);font-weight:700;font-size:13px}
.toast.rare{box-shadow:0 0 0 2px var(--rare),0 12px 32px rgba(0,0,0,.35)}
.toast .pic.gold svg{filter:sepia(1) saturate(3.2) hue-rotate(-10deg) brightness(1.12)}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}8%,86%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}

/* ---------- modals ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,9,8,.6);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface-solid);border-radius:20px;width:min(940px,100%);max-height:min(90vh,960px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal > header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 24px 12px;flex-wrap:wrap}
.modal h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
.modal .sub{color:var(--muted);font-weight:700;font-size:14px;margin-top:2px}
.modal .body{padding:4px 24px 24px;overflow:auto;min-height:0}
.modal > footer{padding:14px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.025);border-radius:0 0 20px 20px}
.modal > footer p{margin:0;color:var(--muted);font-size:13px;font-weight:600;flex:1 1 260px}
.hdr-right{display:flex;align-items:center;gap:10px}
.x{border:0;background:rgba(255,255,255,.07);width:38px;height:38px;border-radius:50%;font-size:20px;line-height:1;flex:none}
.x:hover{background:rgba(255,255,255,.12)}
.langsel{padding:7px 10px;border-radius:10px;border:0;background:var(--raise-2);font-weight:800}
.seg{display:inline-flex;gap:2px;flex-wrap:wrap;background:var(--raise);border-radius:12px;padding:3px}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button small{display:block;font-weight:700;font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--ink);color:#16201c}
.note{color:var(--muted);font-size:13px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* collection */
.classbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-radius:14px;background:var(--raise);margin-bottom:16px}
.classbar label{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-left:4px}
.classbar select,.classbar input{padding:7px 10px;border-radius:10px;border:0;background:var(--raise-2);font-weight:800;min-width:0}
.classbar select{flex:0 1 220px}
.classbar input{flex:1 1 180px}
.classbar .sp{flex:1}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.progress .barx{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.progress .barx i{display:block;height:100%;background:linear-gradient(90deg,var(--calm),var(--sun));border-radius:4px}
.progress b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{border:0;background:var(--raise);border-radius:10px;padding:6px 11px;font-weight:800;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tabs button em{font-style:normal;font-variant-numeric:tabular-nums;opacity:.8}
.tabs button.done em{color:var(--sun);opacity:1}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#16201c}
.tabs button[aria-pressed="true"].done em{color:#8a6400}
.tabs button:disabled{opacity:.45}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{border:0;border-radius:14px;padding:0;background:var(--raise);display:flex;flex-direction:column;text-align:left;overflow:hidden;transition:transform .15s;box-shadow:inset 0 0 0 2px transparent}
.card:hover{transform:translateY(-2px)}
.card .pic{background:var(--tint);aspect-ratio:6/5;max-width:100%;display:grid;place-items:center;position:relative}
.card .pic svg{width:86%;height:86%}
.card.unseen .pic svg{filter:brightness(0) opacity(.22)}
.card .meta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px}
.card b{font-weight:800;font-size:15px;line-height:1.2}
.card.unseen b{color:var(--muted)}
.card small{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.card.u{box-shadow:inset 0 0 0 2px rgba(140,197,255,.4)}
.card.r{box-shadow:inset 0 0 0 2px rgba(255,207,92,.7)}
.card.m{box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.card.unseen{box-shadow:none}
.card.peek{border-style:dashed}
.card.peek .pic{opacity:.92}
.peeknote{margin:0 0 10px}
.card.m .pic{background:linear-gradient(160deg,#25305a,#141a33)}
.chip{align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.chip.c{color:var(--common)}.chip.u{color:var(--uncommon)}.chip.r{color:var(--rare)}.chip.m{color:#d9d4ff}
.count{position:absolute;top:8px;right:8px;background:rgba(17,23,21,.78);color:var(--ink);font-weight:800;font-size:12px;padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.albumfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.detail .pic{background:var(--tint);border-radius:18px;aspect-ratio:6/5;max-width:100%;display:grid;place-items:center}
.detail .pic.m{background:linear-gradient(160deg,#25305a,#141a33)}
.detail .pic svg{width:88%;height:88%}
.detail.unseen .pic svg{filter:brightness(0) opacity(.22)}
.detail h3{font-family:var(--display);font-weight:800;font-size:34px;margin:4px 0 8px;line-height:1.05;text-wrap:balance}
.detail .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.detail .chips .hab{color:var(--muted)}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 16px;font-weight:700}
.detail dt{color:var(--muted)}
.detail dd{margin:0;font-variant-numeric:tabular-nums}
.fact{background:var(--raise);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.5;max-width:62ch}
.fact b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sun);margin-bottom:2px}
.back{margin-bottom:14px}
@media (max-width:640px){.detail{grid-template-columns:1fr}}

/* week */
.goalcard{background:var(--raise);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:center;margin-bottom:16px}
.goalcard h4{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.goalcard .big{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.goalcard .barx{grid-column:1/-1;height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.goalcard .barx i{display:block;height:100%;background:linear-gradient(90deg,var(--calm),var(--sun));border-radius:5px}
.goalcard .stars{text-align:right}
.goalcard .stars b{font-family:var(--display);font-size:26px;color:var(--sun);font-variant-numeric:tabular-nums}
.chartbox{background:var(--raise);border-radius:16px;padding:14px 16px 8px;margin-bottom:16px}
.chartbox h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chartbox .scroll{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:480px;height:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em}

/* quiz */
.advent{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.door{background:linear-gradient(160deg,#3a5a4a,#24382e);border-radius:12px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);text-align:center;padding:4px}
.door b{font-family:var(--display);font-size:26px;color:#f6e7b8;line-height:1}
.door small{font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.2;margin-top:2px}
.door.open{background:#e8eef6;color:#1b211f}
.door.open svg{width:62%;height:auto}
.door.open b{position:absolute;top:4px;left:7px;font-size:14px;color:#8a6a2a}
.door.open small{color:#3a4440}
@media (max-width:640px){.advent{grid-template-columns:repeat(4,1fr)}}
.quiz{max-width:720px;margin:0 auto;text-align:center}
.quiz h3{font-family:var(--display);font-weight:800;font-size:30px;margin:4px 0 4px}
.quiz .pic{background:var(--tint);border-radius:18px;height:min(30vh,240px);max-width:100%;display:grid;place-items:center;margin:12px 0}
.quiz .pic svg{height:88%;width:auto;aspect-ratio:6/5;transition:filter .6s}
.quiz .pic.shadow svg{filter:brightness(0) opacity(.85)}
.quiz .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quiz .opt{border:0;background:var(--raise-2);border-radius:14px;padding:14px;font-weight:800;font-size:18px}
.quiz .opt:hover:not(:disabled){background:#31403a}
.quiz .opt.right{background:var(--calm);color:#06231b}
.quiz .opt.wrong{background:var(--loud);color:#2b0c06}
.quiz .result{min-height:56px;margin:14px 0 6px;font-weight:700;color:var(--muted);line-height:1.5}
.quiz .result b{color:var(--ink);font-size:18px;display:block}
.quiz .score{font-family:var(--display);font-weight:800;font-size:48px;color:var(--sun)}

/* summary */
.sum{width:min(760px,100%)}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.sumgrid div{background:var(--raise);border-radius:14px;padding:12px 14px}
.sumgrid b{display:block;font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.sumgrid span{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.vs{background:var(--raise);border-radius:14px;padding:10px 14px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.vs i{font-style:normal;font-family:var(--display);font-size:22px}
.vs.up i{color:var(--calm)}.vs.down i{color:var(--loud)}
.sumh{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.strip .it{background:var(--tint);border-radius:12px;width:96px;padding:4px 4px 6px;text-align:center;position:relative;color:#1b211f}
.strip .it svg{width:84px;height:70px;margin:0 auto}
.strip .it small{display:block;font-weight:800;font-size:11px;line-height:1.2}
.strip .it em{position:absolute;top:4px;right:4px;background:var(--sun);color:#1d1606;font-style:normal;font-weight:800;font-size:10px;padding:0 6px;border-radius:999px}
.strip .it.m{background:linear-gradient(160deg,#25305a,#141a33);color:var(--ink)}
@media (max-width:560px){.sumgrid{grid-template-columns:1fr 1fr}}

/* settings */
.settings{display:grid;gap:22px}
.field > label,.field > .lbl{display:flex;justify-content:space-between;gap:10px;font-weight:800;margin-bottom:8px}
.field output{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;color:var(--sun)}
.field input[type=range]{width:100%;accent-color:var(--sun)}
.field p{margin:6px 0 0;color:var(--muted);font-size:13px;font-weight:600;max-width:62ch}
.field select{width:100%;padding:9px 10px;border-radius:10px;border:0;background:var(--raise-2);font-weight:700}
.field .seg{display:flex}
.calbox{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--raise);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.calbox .note{flex:1 1 220px}
.calbox .note.live{color:var(--sun);font-size:15px}
.setgroup{display:grid;gap:22px;padding-top:4px}

.intro{width:min(660px,100%)}
.intro .body p{font-size:16px;line-height:1.55;color:#dfe6df;margin:0 0 14px;max-width:62ch}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 18px}
.steps div{background:var(--raise);border-radius:14px;padding:12px;font-weight:700;font-size:14px;color:var(--muted);line-height:1.4}
.steps div svg{width:64px;height:52px;margin-bottom:6px}
.steps div b{color:var(--ink)}
@media (max-width:560px){.steps{grid-template-columns:1fr}}
.err{color:var(--loud);font-weight:800;margin:10px 0 0}

/* timers */
.timer{position:fixed;z-index:25;width:var(--tw,264px);background:var(--surface-solid);border-radius:18px;box-shadow:0 16px 40px rgba(0,0,0,.4);user-select:none}
.timer .grip{display:flex;justify-content:space-between;align-items:center;padding:9px 10px 0 14px;cursor:grab;touch-action:none;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.timer .grip:active{cursor:grabbing}
.timer .grip .x{width:28px;height:28px;font-size:16px}
.timer .t{font-family:var(--display);font-weight:800;font-size:58px;text-align:center;font-variant-numeric:tabular-nums;line-height:1.05;padding:2px 0}
.timer.done .t{color:var(--sun);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.45}}
.timer .tp{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 10px 8px}
.timer .tp button{border:0;background:var(--raise);border-radius:9px;padding:5px 6px;font-weight:800;font-size:12px;color:var(--muted);text-align:left;line-height:1.2}
.timer .tp button small{display:block;font-weight:700;font-size:11px;opacity:.75}
.timer .tp button[aria-pressed="true"]{background:var(--ink);color:#16201c}
.timer .ctl{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;padding:0 10px 10px}
.timer .ctl button{border:0;background:var(--raise-2);border-radius:10px;padding:8px 0;font-weight:800;font-size:13px}
.timer .ctl .go{grid-column:span 2;background:var(--calm);color:#06231b}
.timer .ctl .wide{grid-column:span 2}
.timer .ctl button:disabled{opacity:.35}
.timer .ctl .go.on{background:var(--close);color:#2a1d02}
.timer .grip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer .grip .gb{width:28px;height:28px;border:0;background:transparent;border-radius:8px;color:var(--muted);display:grid;place-items:center;padding:0}
.timer .grip .gb:hover{background:var(--raise);color:var(--ink)}
.timer .grip .gb .ic{width:17px;height:17px}
.timer .dial{display:none;padding:8px 22px 0;touch-action:none}
.timer.pie .dial{display:block}
.timer.pie .barx{display:none}
.timer.pie .t{font-size:26px;padding:4px 0 6px;color:var(--muted)}
.timer.pie.done .t{color:var(--sun)}
.timer .scl{display:flex;justify-content:center;align-items:center;gap:3px;padding:6px 10px 0;font-size:11px;font-weight:800;color:var(--muted)}
.timer .scl span{margin-right:4px}
.timer .scl button{border:0;background:var(--raise);color:var(--muted);border-radius:7px;padding:3px 8px;font-weight:800;font-size:11.5px}
.timer .scl button[aria-pressed="true"]{background:var(--ink);color:#16201c}
.timer .dial svg{display:block;width:100%;height:auto}
.timer .dial.settable{cursor:pointer}
.timer .dial .rim{fill:#e9e6dc}
.timer .dial .face{fill:#fbfaf5}
.timer .dial .wedge{fill:#e8473b}
.timer.done .dial .wedge{fill:#e8473b}
.timer.done .dial svg{animation:pulse 1s ease-in-out infinite alternate}
.timer .dial .tk{stroke:#3a3a36;stroke-width:1;opacity:.55}
.timer .dial .tk.b{stroke-width:2.4;opacity:.9}
.timer .dial text{font:800 13px var(--display);fill:#2a2a26;text-anchor:middle}
.timer .dial .knob{fill:#d8d4c8;stroke:#bdb8aa;stroke-width:1.5}
.wdg{position:fixed;z-index:24}
.wdg .wbar{position:absolute;left:0;bottom:100%;margin-bottom:6px;display:flex;align-items:center;gap:3px;padding:5px;background:var(--surface-solid);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;cursor:grab;touch-action:none;font-family:var(--body)}
.wdg:hover .wbar,.wdg:focus-within .wbar,.wdg.editing .wbar{opacity:1;pointer-events:auto}
.wdg .wbar button,.wdg .wbar select{border:0;background:var(--raise);color:var(--ink);border-radius:8px;height:30px;min-width:30px;padding:0 8px;font-weight:800;font-size:13px;font-family:var(--body)}
.wdg .wbar button:hover{background:var(--raise-2)}
.wdg .wbar button[aria-pressed="true"]{background:var(--ink);color:#16201c}
.wdg .wbar select{padding:0 6px;cursor:pointer}
.wdg .wbar svg{width:16px;height:16px;display:block}
.wdg .wbar .wx{font-size:17px}
.wdg .wgrip{color:var(--muted);font-size:16px;padding:0 4px;cursor:grab}
.wdg .wcols{display:flex;gap:3px;padding:0 3px}
.wdg .wsw{min-width:22px!important;width:22px;height:22px!important;padding:0!important;border-radius:50%!important;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.wdg .wsw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface-solid),0 0 0 4px var(--ink)}
.wtxt .wbox{resize:horizontal;overflow:hidden;min-width:160px;min-height:60px;max-width:96vw;border-radius:18px;padding:14px 20px;transition:background .2s,box-shadow .2s}
.wtxt .wtext{outline:none;min-height:100%;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere}
.wtxt .wtext:empty::before{content:attr(data-ph);opacity:.55}
.wtxt[data-bg="none"] .wbox{background:transparent}
.wtxt[data-bg="none"] .wtext{text-shadow:0 2px 6px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.4)}
.wtxt[data-bg="none"]:hover .wbox,.wtxt[data-bg="none"]:focus-within .wbox{box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
.wtxt[data-bg="glass"] .wbox{background:rgba(16,22,20,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.wtxt[data-bg="paper"] .wbox{background:rgba(255,253,247,.9);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.wtxt[data-bg="note"] .wbox{background:#fff1a8;box-shadow:0 10px 26px rgba(0,0,0,.28);border-radius:4px}
.wtxt[data-bg="board"] .wbox{background:#2f5a46;box-shadow:inset 0 0 0 6px #8a6440,0 10px 30px rgba(0,0,0,.3);border-radius:8px}
.wsym .symrow{display:flex;flex-wrap:wrap;gap:calc(var(--s)*.12);cursor:grab;touch-action:none;max-width:92vw}
.wsym .symt{width:var(--s);display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*.05);user-select:none}
.wsym .symt i{display:grid;place-items:center;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.24);background:var(--c);color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.28),inset 0 -4px 0 rgba(0,0,0,.12)}
.wsym .symt i svg{width:62%;height:62%}
.wsym .symt span{font-family:var(--display);font-weight:800;font-size:calc(var(--s)*.15);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);text-align:center;line-height:1.05}
.wsym .symhint{margin:0;padding:12px 16px;border-radius:14px;background:var(--surface);color:var(--ink);font-weight:700}
.wsym .sympick{margin-top:10px;display:grid;grid-template-columns:repeat(5,82px);gap:6px;padding:10px;background:var(--surface-solid);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.45)}
.wsym .sympick[hidden]{display:none}
.wsym .sympick button{border:0;background:var(--raise);border-radius:12px;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font:800 11px var(--body);line-height:1.1}
.wsym .sympick button i{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--c);color:#fff}
.wsym .sympick button i svg{width:26px;height:26px}
.wsym .sympick button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);background:var(--raise-2)}
@media (max-width:640px){.wsym .sympick{grid-template-columns:repeat(3,82px)}}
.timer .t{font-size:calc(58px * var(--k,1))}
.timer.pie .t{font-size:calc(24px * var(--k,1))}
.timer .dial{padding:8px calc(22px * var(--k,1)) 0}
.timer .rs{position:absolute;right:2px;bottom:2px;width:22px;height:22px;cursor:nwse-resize;touch-action:none;border-radius:0 0 16px 0;background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 58%,transparent 58%,transparent 70%,rgba(255,255,255,.28) 70%,rgba(255,255,255,.28) 78%,transparent 78%)}
.timer.bare{background:transparent;box-shadow:none}
.timer.bare .grip,.timer.bare .tp,.timer.bare .ctl,.timer.bare .scl,.timer.bare .rs,.timer.bare .barx{opacity:0;transition:opacity .25s}
.timer.bare:hover .grip,.timer.bare:hover .tp,.timer.bare:hover .ctl,.timer.bare:hover .scl,.timer.bare:hover .rs{opacity:1}
.timer.bare:hover{background:rgba(22,30,27,.55);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.timer.bare .t{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.6)}
.timer.bare .dial svg{filter:drop-shadow(0 6px 14px rgba(0,0,0,.3))}
.timer .barx{height:4px;margin:0 14px 10px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.timer .barx i{display:block;height:100%;background:var(--calm);width:100%}

#printArea{display:none}
@media print{
  html,body{height:auto;overflow:visible;background:#fff;color:#1b211f}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.pcards{font-family:var(--body);color:#1b211f}
.pcards header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #1b211f;padding-bottom:6px;margin-bottom:10px}
.pcards header b{font-family:var(--display);font-size:22pt}
.pcards header span{font-weight:700;font-size:11pt}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.pcard{border:1.5px solid #1b211f;border-radius:4mm;overflow:hidden;break-inside:avoid;display:grid;grid-template-columns:42mm 1fr}
.pcard .pp{background:var(--tint);display:grid;place-items:center;padding:2mm}
.pcard .pp svg{width:38mm;height:32mm}
.pcard.unseen .pp svg{filter:brightness(0) opacity(.25)}
.pcard .pt{padding:3mm 4mm;font-size:9.5pt;line-height:1.4}
.pcard .pt b{display:block;font-family:var(--display);font-size:14pt;line-height:1.1}
.pcard .pt i{font-style:normal;font-weight:800;font-size:7.5pt;letter-spacing:.08em;text-transform:uppercase;color:#6a5a2a}
.cert{font-family:var(--body);color:#1b211f;border:3mm double #b08a2a;border-radius:6mm;padding:12mm 16mm;text-align:center;height:180mm;display:flex;flex-direction:column;justify-content:space-between}
.cert h1{font-family:var(--display);font-weight:800;font-size:46pt;margin:0;color:#8a6400;letter-spacing:.06em;text-transform:uppercase}
.cert p{font-size:15pt;margin:2mm 0}
.cert .cls{font-family:var(--display);font-weight:800;font-size:34pt;line-height:1.1}
.cert .hab{font-family:var(--display);font-weight:800;font-size:26pt}
.cert .row8{display:flex;justify-content:center;gap:3mm;flex-wrap:wrap}
.cert .row8 div{background:var(--tint);border-radius:3mm;padding:1mm}
.cert .row8 svg{width:22mm;height:18mm}
.cert .foot{display:flex;justify-content:space-between;font-size:11pt;font-weight:700}
.cert .foot span{border-top:1px solid #1b211f;padding-top:2mm;min-width:60mm}

@media (prefers-reduced-motion:reduce){
  .critter .sprite,.critter.alert .sprite{animation:none!important}
  .critter .halo,.critter .sparks i{animation:none;opacity:.8}
  .critter .pose,.critter .baby{animation:fadein 1.5s ease both}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .critter{transition:opacity .8s}
  .card{transition:none}
  #haze.static{animation:none}
  .critter .zz{display:none}
}
</style>

<body>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="topbar">
  <div class="bar surface">

    <button class="habbtn" id="habBtn" aria-haspopup="true"><span class="hab-ic" id="habIc"></span><span><b id="habName"></b><small id="clsName"></small></span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>

<script>
/* ---------- Quiet Critters illustration set: flat, rounded, no outlines. Every animal faces left on a 120×100 canvas, feet on y=96. ---------- */
const ART = (() => {
  const INK = '#221d1a';
  function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  const r1 = n => Math.round(n*10)/10;
  const E=(cx,cy,rx,ry,f,r=0)=>`<ellipse cx="${r1(cx)}" cy="${r1(cy)}" rx="${r1(rx)}" ry="${r1(ry)}" fill="${f}"${r?` transform="rotate(${r} ${r1(cx)} ${r1(cy)})"`:''}/>`;
  const C=(cx,cy,r,f)=>`<circle cx="${r1(cx)}" cy="${r1(cy)}" r="${r1(r)}" fill="${f}"/>`;
  const P=(d,f)=>`<path d="${d}" fill="${f}"/>`;
  const S=(d,col,w,extra='')=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${extra}/>`;
  const leg=(x,top,w,col,hoof,bot=96,hh=3)=>`<rect x="${r1(x-w/2)}" y="${top}" width="${w}" height="${r1(bot-top)}" rx="${r1(w/2)}" fill="${col}"/>`+(hoof?`<rect x="${r1(x-w/2)}" y="${bot-hh}" width="${w}" height="${hh}" rx="${Math.min(w/2,1.5)}" fill="${hoof}"/>`:'');
  const eye=(x,y,r=2.2)=>{r*=1.12;return C(x,y,r,INK)+C(x-r*.3,y-r*.34,r*.42,'#fff')+C(x+r*.34,y+r*.32,r*.16,'rgba(255,255,255,.8)')};
  const cateye=(x,y,col)=>C(x,y,2.5,col)+E(x,y,.8,2,INK)+C(x-.8,y-.9,.6,'#fff');
  const halfH=(cx,rx,ry,x)=>{const t=1-((x-cx)/rx)**2;return t>0?ry*Math.sqrt(t):0};
  const stripes=(cx,cy,rx,ry,xs,col,w)=>xs.map(x=>{const h=halfH(cx,rx,ry,x)*.86;return h>2?S(`M${x} ${r1(cy-h)} Q${x+3} ${cy} ${x} ${r1(cy+h)}`,col,w):''}).join('');
  /* evenly spread spots: dart throwing with a minimum gap, so patterns never clump or pile up */
  const scatter=(cx,cy,rx,ry,n,seed,draw)=>{const R=rng(seed),pts=[],gap=Math.sqrt(Math.PI*rx*ry*.64/n)*.82;let o='',tries=0;
    while(pts.length<n&&tries<n*60){tries++;const a=R()*Math.PI*2,k=Math.sqrt(R())*.8,x=cx+Math.cos(a)*rx*k,y=cy+Math.sin(a)*ry*k,g=gap*(tries>n*30?.7:1);
      if(pts.every(([px,py])=>Math.hypot(px-x,py-y)>=g))pts.push([x,y])}
    pts.sort((p,q)=>p[0]-q[0]);pts.forEach(([x,y],i)=>{o+=draw(x,y,R(),i)});return o};
  const hex=(x,y,r,f)=>{let d='';for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;d+=(i?'L':'M')+r1(x+Math.cos(a)*r)+' '+r1(y+Math.sin(a)*r)}return P(d+'Z',f)};
  const A = {};

  /* ---- savanna ---- */
  A.zebra=()=>{const W='#f4f0e6',D='#2b2a2e',F='#d4cec2';
    let m=S('M94 52 Q103 58 101 72',D,2.5)+E(101,74,2.2,4,D);
    m+=leg(48,60,6,F,D)+leg(82,60,6,F,D);
    m+=P('M47 50 L29 25 L20 31 L38 64 Z',W);
    m+=E(66,56,30,15,W)+stripes(66,56,30,15,[44,50,56,62,68,74,80,86,91],D,3);
    [.22,.42,.62].forEach(t=>{const x=42-17*t,y=57-28*t;m+=S(`M${r1(x-4.3)} ${r1(y+2.6)} L${r1(x+4.3)} ${r1(y-2.6)}`,D,2.6)});
    m+=S('M47 48 L28 23',D,4);
    m+=P('M25 28 L28 17 L32 27 Z',W);
    m+=E(20,39,12,6.2,W,-49)+S('M21 31 L26 35',D,2)+S('M17 36 L23 40',D,2);
    m+=E(13.5,46.5,4,3.4,'#4a474c',-49)+eye(22,35,1.9);
    m+=leg(41,60,6,W,D)+leg(88,60,6,W,D);
    return m};
  A.giraffe=()=>{const W='#e8b25a',D='#c68f3e',Sp='#9a5a2b',H='#5b3d22';
    let m=S('M92 48 Q99 58 97 70',Sp,1.8)+E(97,72,1.8,3.5,H);
    m+=leg(55,55,5,D,H)+leg(86,55,5,D,H);
    m+=P('M52 46 L31 11 L23 15 L44 60 Z',W);
    m+=E(70,52,24,13,W)+scatter(70,52,24,13,11,3,(x,y,r)=>E(x,y,4.2,3.2,Sp,r*180));
    [.2,.42,.64,.84].forEach((t,i)=>m+=E(48-21*t,53-40*t,2.8,2,Sp,30+i*20));
    m+=S('M52 45 L31 10',Sp,2.4);
    m+=S('M26 10 L25 3',Sp,2)+C(25,3,1.9,H)+S('M30 10 L30 3',Sp,2)+C(30,3,1.9,H);
    m+=E(30,13,4.5,1.7,W,-25);
    m+=E(19,16,10,5.5,W,-22)+E(11.5,19,4,3.4,'#d39a4c')+eye(20,13,1.7);
    m+=leg(48,55,5,W,H)+leg(92,55,5,W,H);
    return m};
  A.warthog=()=>{const W='#8b6f61',D='#6e5648',M='#4a3a33',K='#3b2d27';
    let m=S('M92 62 L99 48',M,1.6)+E(99.5,46.5,1.6,3,M);
    m+=leg(52,70,6,D,K)+leg(82,70,6,D,K);
    m+=E(66,66,28,16,W)+S('M50 52 Q66 46 88 55',M,4.5);
    m+=E(32,70,14,11,W)+P('M38 61 L43 51 L47 63 Z',W);
    m+=E(19,75,7,6.5,'#a58473')+E(13.5,76,2.6,4.5,'#5e4840');
    m+=E(25,66,2,1.4,D)+E(26,77,1.8,1.3,D);
    m+=S('M21 80 Q15 79 13 71','#f2ead9',2.6);
    m+=eye(29,66,1.8);
    m+=leg(45,70,6,W,K)+leg(88,70,6,W,K);
    return m};
  A.buffalo=()=>{const W='#463c39',D='#2e2826',H='#9a8f84',K='#1c1817';
    let m=S('M95 56 Q102 64 100 76',D,2)+E(100,78,2,3.5,D);
    m+=leg(48,64,7,D,K)+leg(84,64,7,D,K);
    m+=E(64,60,32,19,W)+E(50,47,15,10,W);
    m+=E(28,66,11,12,W)+E(12,61,4.5,2.2,W,25)+E(44,61,4.5,2.2,W,-25);
    m+=E(28,76,7,5,'#5c514c')+E(25.5,77,1.2,1,K)+E(30.5,77,1.2,1,K);
    m+=P('M15 56 Q28 45 41 56 Q34 52 28 57 Q22 52 15 56Z',H);
    m+=S('M16 56 Q8 58 12 67',H,4)+S('M40 56 Q48 58 44 67',H,4);
    m+=eye(24,65,1.7)+eye(32,65,1.7);
    m+=leg(41,64,7,W,K)+leg(90,64,7,W,K);
    return m};
  A.elephant=()=>{const W='#9ba1a7',D='#80868c';
    let m=S('M97 48 Q103 58 101 70',D,2)+E(101,72,1.6,3,'#5d6268');
    m+=leg(52,62,11,D)+leg(82,62,11,D);
    m+=E(66,52,32,24,W)+E(30,46,16,17,W);
    m+=S('M21 52 Q12 70 17 84 Q19 89 24 87',W,8);
    m+=S('M26 58 Q20 66 13 64','#f4ede1',3);
    m+=E(44,46,11,16,'#8d9399')+E(45,46,7,11,'#cfa8a8');
    m+=eye(27,42,2);
    m+=leg(43,62,11,W)+leg(88,62,11,W);
    [43,88].forEach(x=>m+=E(x-2.5,94.5,1.6,1,'#dde0e3')+E(x+2.5,94.5,1.6,1,'#dde0e3'));
    return m};
  A.hippo=()=>{const W='#8f7a8c',D='#76637a',L='#a58ea0';
    let m=S('M97 60 L103 64',D,2.6);
    m+=leg(50,72,10,D)+leg(84,72,10,D);
    m+=E(66,64,32,20,W)+E(66,75,22,7,L);
    m+=E(34,58,15,13,W)+E(22,68,14,11,L);
    m+=C(37,47,4.6,W)+eye(37,47,1.8)+E(45,46,2.5,3.6,W,15);
    m+=E(14,62,1.5,1,'#4b3d4a')+E(20,60,1.5,1,'#4b3d4a')+E(27,72,4,2.2,'#d79fa7');
    m+=`<rect x="13" y="74" width="2.6" height="4.5" rx="1" fill="#f6f0e4"/>`;
    m+=leg(42,72,10,W)+leg(90,72,10,W);
    return m};
  A.rhino=()=>{const W='#8a8e85',D='#71756c',Hn='#d8cfbb';
    let m=S('M95 56 Q100 62 98 70',D,1.6);
    m+=leg(52,64,9,D)+leg(82,64,9,D);
    m+=E(66,60,30,19,W)+S('M46 46 Q48 60 46 76',D,1.6);
    m+=E(30,66,15,10,W,-15)+P('M38 56 L40 45 L45 56 Z',W);
    m+=P('M12 67 L9 46 L22 63 Z',Hn)+P('M24 61 L25 52 L30 60 Z',Hn);
    m+=E(15,72,4,3,'#7b7f76')+eye(31,62,1.7);
    m+=leg(44,64,9,W)+leg(88,64,9,W);
    return m};
  const bigcat=o=>{const {c:W,d:D,b:B,sp,big}=o;const ry=big?12.5:11, rr=big?3.2:2.4;
    let m=S('M92 58 Q110 62 106 82',W,big?4.6:4)+C(104,64,1.4,sp)+C(107.5,72,1.4,sp)+C(106,80,1.6,sp);
    m+=leg(50,64,big?7:6,D)+leg(84,64,big?7:6,D);
    m+=E(66,62,28,ry,W)+E(66,69,20,4.5,B);

  const segs=(pts,r,col,stripe)=>pts.map(([x,y],i)=>E(x,y,r*(1-Math.abs(i-pts.length/2)/pts.length*.4),r*.86,col)+(stripe?S(`M${x-r*.3} ${y-r*.75} Q${x+r*.1} ${y} ${x-r*.3} ${y+r*.75}`,stripe,.9):'')).join('');
  A.ugworm=()=>{const P1='#d88a8a',D='#b86a6a';
    const pts=Array.from({length:16},(_,i)=>{const t=i/15;return [96-t*68,84-Math.sin(t*Math.PI)*16]});
    let m=segs(pts,5.4,P1,D)+E(pts[6][0],pts[6][1],5.6,5,'#e8a0a8');
    const [hx,hy]=pts[15];return m+C(hx-1,hy-2,2.6,'#fff')+eye(hx-1,hy-2,1.6)+smile(hx-4,hy+2.4,1.6,'#8a3a3a')+blush(hx+3,hy+1,1.4)};
  A.ugant=()=>{const K='#5a2a1a',D='#3a1a10';
    let m=[[54,76,46,92],[60,77,60,93],[66,76,74,92],[56,76,40,86],[64,76,80,86]].map(([a,b,c2,d])=>S(`M${a} ${b} Q${(a+c2)/2} ${b-4} ${c2} ${d}`,D,1.6)).join('');
    m+=E(82,74,13,9,K)+E(80,71,6,3,'rgba(255,255,255,.18)')+E(60,74,7,5,K)+C(42,68,8,K)+E(40,65,3.6,2,'rgba(255,255,255,.18)');
    m+=S('M38 62 Q30 48 24 46 M42 61 Q40 46 34 40',D,1.4)+P('M34 74 L26 72 L28 78Z',D)+P('M18 80 Q16 70 26 68 Q32 74 26 82Z','#7ab84a')+C(38,67,2.4,'#fff')+eye(38,67,1.6);
    return m};

function easterDate(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function seasonRange(b,y){
  const s=b.season;
  if(s==='fasching'){const e=easterDate(y),ash=new Date(e);ash.setDate(e.getDate()-46);return [new Date(y,0,7),ash]}
  if(s==='easter'){const e=easterDate(y),end=new Date(e);end.setDate(e.getDate()+14);return [new Date(y,2,1),end]}
  const st=new Date(y,s.from[0]-1,s.from[1]);let en=new Date(y,s.to[0]-1,s.to[1]);if(en<st)en=new Date(y+1,s.to[0]-1,s.to[1]);return [st,en];
}
const today=()=>{const d=NOW();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
function inSeason(b){if(!b.season)return true;const d=today();return [d.getFullYear()-1,d.getFullYear()].some(y=>{const [a,e]=seasonRange(b,y);return d>=a&&d<=e})}
const shortDate=d=>d.toLocaleDateString(locale(),{day:'numeric',month:'short'});
function seasonLabel(b){const d=today();for(const y of [d.getFullYear()-1,d.getFullYear(),d.getFullYear()+1]){const [a,e]=seasonRange(b,y);if(d<=e)return d>=a?t('until',{d:shortDate(e)}):t('from',{d:shortDate(a)})}return ''}
function unlockedSet(){
  const s=new Set();
  BIOMES.forEach(b=>{if(b.season&&(S.seasonAll==='on'||inSeason(b)))s.add(b.id)});
  const reg=BIOMES.filter(b=>!b.season);
  if(S.journey==='all'){reg.forEach(b=>s.add(b.id));return s}
  const n=2+reg.filter(b=>countIn(b)>=Math.ceil(b.animals.length/2)).length;
  JOURNEY.slice(0,n).forEach(id=>s.add(id));s.add('schoolyard');
  reg.forEach(b=>{if(countIn(b)>0||totals.moments[b.id])s.add(b.id)});
  return s;
}

const TAU = Math.PI*2;

function lin(c,y0,y1,stops){const g=c.createLinearGradient(0,y0,0,y1);stops.forEach(([o,col])=>g.addColorStop(o,col));return g}
function rad(c,x,y,r,stops){const g=c.createRadialGradient(x,y,0,x,y,r);stops.forEach(([o,col])=>g.addColorStop(o,col));return g}
function skyFill(c,stops,y1=H){c.fillStyle=lin(c,0,y1,stops);c.fillRect(0,0,W,H)}
function ridge(c,base,amp,fill,R,n=8){
  const pts=[];for(let i=0;i<=n;i++)pts.push([W*i/n,base-(R()*2-1)*amp]);
  c.beginPath();c.moveTo(0,H);c.lineTo(pts[0][0],pts[0][1]);
  for(let i=0;i<n;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;c.quadraticCurveTo(pts[i][0],pts[i][1],mx,my)}
  c.lineTo(W,pts[n][1]);c.lineTo(W,H);c.closePath();c.fillStyle=fill;c.fill();
}
function disc(c,x,y,r,f){c.beginPath();c.arc(x,y,r,0,TAU);c.fillStyle=f;c.fill()}
function ell(c,x,y,rx,ry,rot,f){c.beginPath();c.ellipse(x,y,rx,ry,rot,0,TAU);c.fillStyle=f;c.fill()}
function leaf(c,x,y,len,ang,col,rib){
  c.save();c.translate(x,y);c.rotate(ang);
  c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(len*.5,-len*.28,len,0);c.quadraticCurveTo(len*.5,len*.28,0,0);c.fillStyle=col;c.fill();
  if(rib){c.strokeStyle=rib;c.lineWidth=Math.max(1,len*.02);c.beginPath();c.moveTo(0,0);c.lineTo(len*.95,0);c.stroke()}
  c.restore();
}
/* a soft, slowly changing breeze: -1..1, different along the x axis so things don't move in lockstep */
const wind=(t,x)=>Math.sin(t*1.1+x*.004)*.6+Math.sin(t*.47+x*.011+1.3)*.4;

/* ---------- shared moving props ---------- */
function tuftProps(y0,y1,n,cols,R,sz,skip){
  const list=[];
  for(let i=0;i<n;i++){let y=y0+(y1-y0)*Math.pow(R(),.8),x=R()*W;for(let k=0;skip&&k<6&&skip(x,y);k++)x=(x+W*.37)%W;const s=sz*(.5+(y-y0)/(y1-y0)),k=3+(R()*3|0),blades=[];
    for(let j=0;j<k;j++)blades.push({a:-Math.PI/2+(j-(k-1)/2)*.25+(R()-.5)*.2,dx:j*s*.05});
    list.push({x,y,s,col:cols[i%cols.length],blades})}
  list.sort((a,b)=>a.y-b.y);
  return (c,t)=>{c.lineCap='round';list.forEach(o=>{const w=wind(t,o.x)*o.s*.2;c.strokeStyle=o.col;c.lineWidth=Math.max(1,o.s*.08);c.beginPath();
    o.blades.forEach(b=>{c.moveTo(o.x+b.dx,o.y);c.quadraticCurveTo(o.x+Math.cos(b.a)*o.s*.5+w*.35,o.y+Math.sin(b.a)*o.s*.6,o.x+Math.cos(b.a)*o.s*.9+b.dx+w,o.y+Math.sin(b.a)*o.s)});c.stroke()})};
}
function cloudProps(R,n,y0,y1,col,speed=1){
  const cl=[];for(let i=0;i<n;i++)cl.push({x:R(),y:y0+R()*(y1-y0),s:.6+R()*.8,v:(.5+R())*speed,parts:Array.from({length:4},()=>({dx:(R()-.5)*1.6,dy:(R()-.5)*.35,r:.35+R()*.4}))});
  return (c,t)=>{c.fillStyle=col;cl.forEach(o=>{const S=H*.07*o.s,span=W+S*4,x=((o.x*span+t*o.v*W*.004)%span)-S*2,y=o.y*H;
    o.parts.forEach(p=>{c.beginPath();c.ellipse(x+p.dx*S,y+p.dy*S,S*p.r*1.6,S*p.r,0,0,TAU);c.fill()})})};
}
function flockProps(R,n,y,col,period,size=1){
  const b=Array.from({length:n},(_,i)=>({dx:i*16*(R()+.5),dy:(R()-.5)*16,ph:R()*6}));
  return (c,t)=>{const p=(t/period)%1,bx=-W*.15+p*W*1.3,by=H*y+Math.sin(t*.3)*H*.02;c.strokeStyle=col;c.lineWidth=1.6*size;c.lineCap='round';
    b.forEach(o=>{const x=bx+o.dx*size,yy=by+o.dy*size,f=Math.sin(t*6+o.ph)*3*size,s=5*size;c.beginPath();c.moveTo(x-s,yy+f);c.quadraticCurveTo(x-s*.4,yy-1,x,yy);c.quadraticCurveTo(x+s*.4,yy-1,x+s,yy+f);c.stroke()})};
}

function oakSprite(R,S){

    const g=c.createLinearGradient(X-S*.05,0,X+S*.05,0);g.addColorStop(0,'#3e2a1a');g.addColorStop(.4,'#6e5034');g.addColorStop(1,'#34241a');
    c.fillStyle=g;c.beginPath();c.moveTo(X-S*.06,Y);c.quadraticCurveTo(X-S*.035,Y-S*.3,X-S*.03,cy+S*.1);c.lineTo(X+S*.03,cy+S*.1);c.quadraticCurveTo(X+S*.035,Y-S*.3,X+S*.07,Y);c.closePath();c.fill();
    c.strokeStyle='rgba(30,20,10,.35)';c.lineWidth=1.2;for(let k=0;k<6;k++){c.beginPath();const x=X-S*.025+k*S*.01;c.moveTo(x,Y-2);c.bezierCurveTo(x-2,Y-S*.2,x+2,Y-S*.4,x,cy+S*.15);c.stroke()}
    c.strokeStyle='#4e3826';c.lineWidth=S*.018;c.lineCap='round';[[-1,.72],[1,.68],[-1,.6]].forEach(([d,h])=>{c.beginPath();c.moveTo(X,Y-S*h);c.quadraticCurveTo(X+d*S*.06,Y-S*(h+.05),X+d*S*.1,Y-S*(h+.12));c.stroke()});
    const cols=['#24461f','#2f5627','#3b6a30','#4a7c38','#5c8e42','#72a24e'];
    [[0,0,.38,.3],[-.2,.1,.24,.2],[.2,.08,.24,.2],[-.08,-.14,.26,.2],[.14,-.12,.22,.18],[0,.2,.3,.16]].forEach(([dx,dy,rx,ry])=>{
      c.fillStyle='#2a4a22';c.beginPath();c.ellipse(X+S*dx,cy+S*dy+S*ry*.15,S*rx,S*ry,0,0,TAU);c.fill();
      dabs(c,R,X+S*dx,cy+S*dy,S*rx,S*ry,Math.round(rx*ry*4200),cols,S*.012,'rgba(200,230,140,.35)')});
  })}

    return [
      cloudProps(R,2,.06,.18,'rgba(255,255,255,.55)',.6),

      (c,t)=>flowers.forEach(f=>{const s=H*.004*(1+(f.y/H-.64)*3),w=wind(t,f.x)*s*.8;c.strokeStyle='#4a8a2a';c.lineWidth=1;c.beginPath();c.moveTo(f.x,f.y);c.lineTo(f.x+w,f.y-s*3);c.stroke();for(let k=0;k<5;k++){const a=k*TAU/5;disc(c,f.x+w+Math.cos(a)*s*.6,f.y-s*3+Math.sin(a)*s*.6,s*.5,f.col)}disc(c,f.x+w,f.y-s*3,s*.35,'#f2c23a')}),
      tuftProps(H*.64,H,110,['#4e8a2e','#6fa844','#8cc05a'],R,H*.03),

/* ================= detail pass for the remaining worlds =================
   Each world keeps its layout; this adds texture (grass, sand, snow, rock), depth and
   foliage made of many small leaf dabs, in the same style as the savanna and the woodland. */
function enrich(id,o){const base=SCENES[id];if(!base)return;
  SCENES[id]={bg(c,R){base.bg(c,R);if(o.bg)o.bg(c,rng(id.length*313+5))},
    props(R){let list=base.props(R);const R2=rng(id.length*977+3);
      if(o.replace)Object.entries(o.replace).forEach(([i,f])=>{list[+i]=f(R2)});
      if(o.after)list=list.concat(o.after(R2));if(o.before)list=o.before(R2).concat(list);return list}}}
function fineGrass(c,R,y0,y1,n,dark,light,hk=1){for(let i=0;i<n;i++){const y=y0+(y1-y0)*Math.pow(R(),1.5),x=R()*W,h=H*.006*hk*(1+(y/H-.6)*9)*(.6+R()*.8);grassBlade(c,x,y,h,(R()-.5)*h*.5,R()<.5?dark:light,1)}}
const clearOf=col=>col.replace(/,[^,]*\)$/,',0)');
function softPatches(c,R,y0,y1,n,a,b){for(let i=0;i<n;i++){const y=y0+(y1-y0)*Math.pow(R(),1.2),x=R()*W,rx=W*(.05+R()*.12)*(y/H),col=R()<.5?a:b;c.save();c.translate(x,y);c.scale(1,.13);disc(c,0,0,rx,rad(c,0,0,rx,[[0,col],[1,clearOf(col)]]));c.restore()}}
function specks(c,R,y0,y1,n,cols,sz=1.6){for(let i=0;i<n;i++){const y=y0+(y1-y0)*Math.pow(R(),1.3),x=R()*W,s=sz*(.5+(y/H)*1.2)*(.5+R());c.fillStyle=cols[i%cols.length];c.beginPath();c.ellipse(x,y,s,s*.6,0,0,TAU);c.fill()}}
function snowTex(c,R,y0,y1){
  c.strokeStyle='rgba(150,180,215,.35)';c.lineCap='round';
  for(let i=0;i<70;i++){const y=y0+(y1-y0)*Math.pow(R(),1.3),x=R()*W,l=W*(.015+R()*.04)*(y/H);c.lineWidth=1+(y/H-.6)*2;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+l*.5,y-H*.004*(y/H),x+l,y);c.stroke()}
  for(let i=0;i<260;i++){const y=y0+(y1-y0)*R(),x=R()*W;c.fillStyle=R()<.6?'rgba(255,255,255,.9)':'rgba(170,200,230,.5)';c.fillRect(x,y,1.4,1.4)}
  softPatches(c,R,y0,y1,10,'rgba(160,190,225,.25)','rgba(255,255,255,.5)');
}
function sandTex(c,R,y0,y1,dark,light){
  specks(c,R,y0,y1,500,[dark,light],1.2);
  c.strokeStyle=dark;c.lineWidth=1;for(let i=0;i<40;i++){const y=y0+(y1-y0)*R(),x=R()*W,l=W*(.02+R()*.04)*(y/H);c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+l/2,y-H*.003,x+l,y);c.stroke()}
}
/* a leafy crown made of overlapping blobs and many small leaf dabs, pre-rendered once */
function crownSprite(R,blobs,cols,dab,dark,light){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;blobs.forEach(([x,y,r])=>{x0=Math.min(x0,x-r);y0=Math.min(y0,y-r);x1=Math.max(x1,x+r);y1=Math.max(y1,y+r)});
  const pad=dab*2,sp=sprite(x1-x0+pad*2,y1-y0+pad*2,c=>{c.translate(pad-x0,pad-y0);
    blobs.forEach(([x,y,r])=>disc(c,x,y+r*.08,r,dark));
    blobs.forEach(([x,y,r])=>dabs(c,R,x,y,r*.98,r*.98,Math.round(r*r/(dab*dab)*1.1),cols,dab,light))});
  sp.ox=x0-pad;sp.oy=y0-pad;return sp}
function drawSprite(c,sp,x,y,rot=0,ax=0,ay=0){c.save();c.translate(x+ax,y+ay);c.rotate(rot);c.drawImage(sp.cv,sp.ox-ax,sp.oy-ay,sp.w,sp.h);c.restore()}

/* ---------- Cretaceous ---------- */
enrich('cretaceous',{

const UG={g:[[.29,.395],[.49,.595],[.68,.785]],x:[[-.03,.72],[.26,1.03],[-.03,.84]]};   // the three galleries: [roof, floor] as share of the height
function ugTube(c,R,top,floor,x0,x1,col){
  const p1=R()*6,p2=R()*6,p3=R()*6,N=120,tp=[],fl=[];
  for(let i=0;i<=N;i++){const q=i/N,x=x0+(x1-x0)*q,r=(floor-top)*1.1,d=Math.min(x-x0,x1-x),e=d<r?Math.sqrt(Math.max(0,1-(1-d/r)**2)):1;
    const roof=top+H*(.012*Math.sin(q*7+p1)+.007*Math.sin(q*17+p2)+.004*Math.sin(q*31+p3));
    tp.push([x,floor-(floor-roof)*e]);fl.push([x,floor+H*.003*Math.sin(q*11+p3)+(1-e)*H*.004])}
  const path=()=>{c.beginPath();tp.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));for(let i=fl.length-1;i>=0;i--)c.lineTo(fl[i][0],fl[i][1]);c.closePath()};
  c.save();path();c.lineJoin='round';c.strokeStyle='rgba(255,232,196,.13)';c.lineWidth=H*.016;c.stroke();c.strokeStyle='rgba(40,24,12,.25)';c.lineWidth=H*.006;c.stroke();
  c.fillStyle=lin(c,top-H*.02,floor,[[0,'#22150c'],[.55,col],[1,'#5a3e28']]);c.fill();c.clip();
  // packed floor and crumbs, soft root tips poking through the roof
  c.fillStyle=lin(c,floor-H*.022,floor,[[0,'rgba(150,110,70,0)'],[1,'rgba(150,110,70,.55)']]);c.fillRect(x0,floor-H*.022,x1-x0,H*.03);
  for(let i=0;i<(x1-x0)/6;i++){const x=x0+R()*(x1-x0);ell(c,x,floor-R()*H*.006,1+R()*2,.8+R(),0,R()<.5?'rgba(170,130,90,.6)':'rgba(30,18,10,.5)')}
  c.lineCap='round';for(let i=0;i<(x1-x0)/70;i++){const x=x0+R()*(x1-x0),k=Math.round((x-x0)/(x1-x0)*N),y=tp[k][1]-4,l=H*(.01+R()*.025);c.strokeStyle='rgba(215,185,135,.7)';c.lineWidth=1.3;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+(R()-.5)*10,y+l*.6,x+(R()-.5)*8,y+l);c.stroke()}
  c.restore();
}

function playMoment(b){

    if(T>D){fxRun=null;return}
    const e=Math.min(1,T/2,(D-T)/2.5);fx.save();(FX[b.id]||FX.savanna)(fx,innerWidth,innerHeight,T,Math.max(0,e),P);fx.restore();fxRun=requestAnimationFrame(frame)};
  fxRun=requestAnimationFrame(frame);
}

/* ================= critters ================= */
let critters=[];
function pickAnimal(demo){
  let r=Math.random();
  // rare visitors only show up once the class has been quiet for a while, and never two at once
  const rareOk=!demo&&(st.sess?st.sess.quiet>=180:false)&&!critters.some(c=>c.a.r==='r');
  if(!rareOk&&r<WEIGHT.r)r=WEIGHT.r+Math.random()*(1-WEIGHT.r);
  if(demo&&r<WEIGHT.r+WEIGHT.u)r=1;
  const kt=biome.animals.filter(a=>a.id.startsWith('kt'));
  if(kt.length&&rareOk&&Math.random()<.1)return kt[Math.random()*kt.length|0];   // our own class figures: about 1 in 10 visitors once the class has been quiet
  const tier=r<WEIGHT.r?'r':r<WEIGHT.r+WEIGHT.u?'u':'c';
  const pool=biome.animals.filter(a=>a.r===tier&&!a.id.startsWith('kt'));return pool[Math.random()*pool.length|0];
}
function spawn(opt={}){
  const a=opt.animal||pickAnimal(opt.demo), z=a.z||biome.zone, u=Math.min(H*.12,W*.09);
  let best=null;
  for(let k=0;k<30;k++){
    const xr=a.xr||[.07,.93], x=xr[0]+Math.random()*(xr[1]-xr[0]), y=z[0]+Math.random()*(z[1]-z[0]);
    const p = a.m==='stand' ? .72+.5*(y-z[0])/Math.max(.001,z[1]-z[0]) : .85+Math.random()*.3;
    const size=u*a.s*p*1.4;
    let minD=Infinity;critters.forEach(c=>{const d=Math.hypot((c.x-x)*W,(c.y-y)*H)-(c.size+size)*.42;minD=Math.min(minD,d)});
    if(!best||minD>best.minD)best={x,y,p,size,minD};
    if(minD>0)break;
  }
  const el=document.createElement('div');
  el.className='critter '+a.m+(biome.glow?' glow':'')+(biome.night?' night':'')+(opt.golden?' golden':'');
  el.style.left=(best.x*100)+'%';el.style.top=(best.y*100)+'%';
  el.style.fontSize=`calc(var(--u) * ${(a.s*best.p).toFixed(3)})`;
  el.style.zIndex=Math.round(best.y*1000);
  el.style.setProperty('--flip',Math.random()<.5?1:-1);
  const rare=a.r==='r'&&!opt.golden;
  const sparkle=rare?'<span class="halo"></span><span class="sparks">'+Array.from({length:9},(_,i)=>{const ang=i/9*6.283+Math.random()*.5,rr=.38+Math.random()*.22;return `<i style="left:${(50+Math.cos(ang)*rr*100).toFixed(1)}%;top:${(52+Math.sin(ang)*rr*90).toFixed(1)}%;animation-delay:-${(Math.random()*2.4).toFixed(2)}s;--s:${(.6+Math.random()*.7).toFixed(2)}"></i>`}).join('')+'</span>':'';
  el.innerHTML=`<div class="pose"><span class="sprite" style="animation-delay:-${(Math.random()*4).toFixed(2)}s">${sparkle}<span class="glyph">${ART.svg(a.id)}</span><span class="zz">z</span></span></div>`;
  if(rare)el.classList.add('rare');
  const first=!opt.demo&&!rec(biome.id,a.id);
  if(first||opt.golden||(!opt.demo&&a.r==='r')){const tg=document.createElement('span');tg.className='tag';tg.textContent=opt.golden?t('goldenName',{name:aName(a)}):aName(a);el.appendChild(tg)}
  layer.appendChild(el);
  const c={a,el,x:best.x,y:best.y,size:best.size,demo:!!opt.demo,age:0,settled:false,baby:false,babyOk:BABY.has(a.id)&&Math.random()<.7};
  critters.push(c);
  if(opt.demo)return c;
  const before=unlockedSet();
  log[biome.id]=log[biome.id]||{};
  const r=log[biome.id][a.id]||{n:0,first:null};r.n++;if(!r.first)r.first=Date.now();log[biome.id][a.id]=r;saveLog();
  if(st.sess){st.sess.spotted[a.id]=(st.sess.spotted[a.id]||0)+1;if(first)st.sess.newIds.push(a.id)}
  updateCount();
  if(opt.golden){/* its own toast is shown by the goal check */}
  else if(first){
    toast(a,t(a.r==='r'?'rareDisc':'newFor',{name:aName(a)}),t('cardOf',{rar:t(a.r),k:countIn(biome),n:biome.animals.length,b:bName(biome)}));
    if(countIn(biome)===biome.animals.length){const b=biome;setTimeout(()=>toast(b.animals.find(x=>x.r==='r'),t('complete',{b:bName(b)}),t('completeSub'),true),1800)}
  } else if(a.r==='r') toast(a,t('rareVisitor',{name:aName(a)}),t('spotted',{n:r.n}));
  const after=unlockedSet();
  JOURNEY.forEach(id=>{if(after.has(id)&&!before.has(id)){const b=BYID(id);setTimeout(()=>toastHtml(ART.svg(b.icon),b.tint,t('unlockedT',{b:bName(b)}),t('unlockedSub'),true),3200)}});
  return c;
}
function hide(list,instant){
  list.forEach(k=>{
    critters=critters.filter(c=>c!==k);
    if(instant){k.el.remove();return}
    k.el.classList.remove('alert','moving');
    if(biome.fizz){k.el.classList.add('fizz');requestAnimationFrame(()=>k.el.classList.add('flee'))}
    else{const right=k.x>.5;k.el.style.setProperty('--flip',right?-1:1);requestAnimationFrame(()=>{k.el.classList.add('flee');k.el.style.left=(right?118:-18)+'%'})}
    setTimeout(()=>k.el.remove(),1400);
  });
}
function sendAway(n){
  const pool=critters.slice();const out=[];
  while(out.length<n&&pool.length)out.push(pool.splice(Math.random()*pool.length|0,1)[0]);
  hide(out);return out.length;
}
/* animals wander now and then: walkers stroll a few steps, flyers drift, swimmers glide */
const STILL=new Set(['sloth','snowman','treesprite','mussel','cockle','lugworm','spider','jacksprite']);
const SLOW=new Set(['kttommi','snail','gardensnail','pondsnail','tortoise','turtle','rivturtle','seacucumber','isopod','brittlestar','seastar','glowworm','hedgehog','hhedgehog','moonmouse']);

  const still=S.motion==='off'||reduceMotion.matches||document.body.classList.contains('paused');
  critters.forEach(c=>{
    const a=c.a,el=c.el,alert=el.classList.contains('alert'),sp=c.sp||(c.sp=el.querySelector('.sprite'));
    const w=c.w||(c.w={st:'idle',t:a.m==='stand'?3+Math.random()*6:1+Math.random()*3,ph:Math.random()*20,vy:0,act:0});
    if(still){if(a.m!=='stand'||el.classList.contains('moving')){sp.style.transform='';}return}
    w.ph+=dt;
    let px=c.x,py=c.y;
    if(w.st==='move'&&!STILL.has(a.id)){
      if(alert){w.st='idle';w.t=2+Math.random()*2;el.classList.remove('moving')}
      else{
        w.p=Math.min(1,w.p+dt/w.dur);
        const e=.5-.5*Math.cos(Math.PI*w.p);                       // ease in and out
        let x=w.sx+(w.tx-w.sx)*e,y=w.sy+(w.ty-w.sy)*e;
        if(a.m!=='stand'){const arc=Math.sin(Math.PI*e)*w.arc+(a.m==='fly'?Math.sin(Math.PI*2*e)*w.arc*.35:0);y+=arc}
        c.x=x;c.y=y;el.style.left=(x*100)+'%';el.style.top=(y*100)+'%';
        if(a.m!=='stand')el.style.zIndex=Math.round(y*1000);
        if(w.p>=1){w.st='idle';w.t=idleTime(a);el.classList.remove('moving')}

    }

    w.act+=(Math.min(1,speed*1.6)-w.act)*Math.min(1,dt*3);
    const vy=(c.y-py)*H/Math.max(dt,1e-3)/Math.max(8,c.size);w.vy+=(vy-w.vy)*Math.min(1,dt*2.5);
    if(w.flip==null)w.flip=+el.style.getPropertyValue('--flip')||1;const flip=w.flip,ph=w.ph,A=w.act;
    if(a.m==='swim'){
      const bob=Math.sin(ph*.8)*.045+Math.sin(ph*.31+1.7)*.03,beat=ph*(1.6+A*2.2);
      const tilt=clamp(-w.vy*22*flip,-12,12)+Math.sin(ph*.8+1.2)*1.6;
      sp.style.transform=`translateY(${bob.toFixed(3)}em) rotate(${tilt.toFixed(2)}deg) skewY(${(Math.sin(beat)*(1+A*1.4)).toFixed(2)}deg) scaleX(${(1+Math.sin(beat+1.3)*.012).toFixed(4)})`;
    }else if(a.m==='fly'){
      const bob=Math.sin(ph*1.3)*.06+Math.sin(ph*.47+2)*.035,flap=Math.sin(ph*(5+A*4));
      const tilt=clamp(-w.vy*18*flip,-14,14)+Math.sin(ph*.6)*2.2+(-A*4*flip*0);
      sp.style.transform=`translateY(${bob.toFixed(3)}em) rotate(${tilt.toFixed(2)}deg) scaleY(${(1+flap*(.018+A*.02)).toFixed(4)})`;
    }else if(el.classList.contains('moving')){
      const step=ph*7.5,lift=Math.abs(Math.sin(step))*.022*A;
      sp.style.transform=`translateY(${(-lift).toFixed(4)}em) rotate(${(Math.sin(step)*1.1*A).toFixed(2)}deg) scale(${(1+Math.cos(step*2)*.006*A).toFixed(4)},${(1-Math.cos(step*2)*.01*A).toFixed(4)})`;
    }else if(sp.style.transform)sp.style.transform='';
    if(STILL.has(a.id)||w.st==='move')return;

    }
    if(!ok){w.t=2+Math.random()*3;return}
    const v=c.size*(a.m==='stand'?.16:a.m==='swim'?.13:.2)*(SLOW.has(a.id)?.22:1)*(.8+Math.random()*.4);

}

/* ================= main loop ================= */
const intervalSec=()=>st.first?st.firstDelay:paceMin()*60;
let last=performance.now(),lastMove=performance.now();
function step(dt){
  const raw=readLevel();
  st.display+=(raw-st.display)*(raw>st.display?1-Math.exp(-dt*18):1-Math.exp(-dt*3));
  const L=st.display,thr=S.threshold;
  runCalibration(raw,dt);
  let state='idle';
  if(st.mode!=='off'&&!st.hold){
    if(st.sess)st.sess.listen+=dt;
    const over=L>thr, excess=L-thr;
    if(over){
      // a little over: about 6 s before it counts; much louder: about 1 s (scaled by the strictness setting)
      const rate=(excess>=20?1:excess<=5?1/6:1/6+(excess-5)/15*(5/6))*LOUDK[S.loudK];
      st.pressure=Math.min(1,st.pressure+dt*rate);st.quietFor=0;
    }else{st.quietFor+=dt;st.pressure=Math.max(0,st.pressure-dt*.5)}
    if(!st.loud&&st.pressure>=1){
      st.loud=true;totals.startles++;if(st.sess)st.sess.loud++;
      if(st.streak>totals.best)totals.best=st.streak;st.streak=0;st.momentAt=MOMENT_EVERY;saveTotals();
      if(S.loudMode==='run'){sendAway(1);st.fleeT=5;st.progress*=.5}
      else document.body.classList.add('paused');
    }
    if(st.loud){
      if(over&&S.loudMode==='run'){st.fleeT-=dt;if(st.fleeT<=0){sendAway(2);st.fleeT=5}}
      if(st.quietFor>=1.5){st.loud=false;st.pressure=0;document.body.classList.remove('paused')}
    }
    if(!st.loud&&!over){
      st.streak+=dt;addQuiet(dt);settleTick(dt);
      if(st.streak>=st.momentAt){st.momentAt+=MOMENT_EVERY;momentHappens()}
      if(critters.length<S.max){st.progress+=dt/intervalSec();if(st.progress>=1){st.progress=0;st.first=false;spawn()}}
    }
    state = st.loud ? 'loud' : over ? 'building' : critters.length>=S.max ? 'full' : L>thr*.85 ? 'close' : 'quiet';
    const nervous=!st.loud&&(over||L>thr*.85);
    critters.forEach(c=>c.el.classList.toggle('alert',nervous));
  }
  const hazeTarget = st.loud ? .72 : st.pressure*.4;
  st.haze += hazeTarget>st.haze ? Math.min(hazeTarget-st.haze,dt*.9) : -Math.min(st.haze-hazeTarget,dt*.3);

}

}

/* ================= calibration ================= */
function runCalibration(raw,dt){
  const c=st.cal;if(!c)return;
  c.t-=dt;
  if(c.step===1){c.s1+=raw;c.n1++}else{c.s2+=raw;c.n2++}
  const msg=$('#calMsg');msg.classList.add('live');
  msg.textContent=t(c.step===1?'calSilence':'calTalk',{s:Math.max(1,Math.ceil(c.t))});
  if(c.t<=0&&c.step===1){c.step=2;c.t=5}
  else if(c.t<=0){
    const a=c.s1/c.n1,b=c.s2/c.n2;st.cal=null;msg.classList.remove('live');
    if(b-a<6){msg.textContent=t('calWeird');return}
    const span=b-a;
    const P={silent:Math.round(clamp(a+span*.2+3,8,90)),whisper:Math.round(clamp(a+span*.55,12,92)),partner:Math.round(clamp(b+span*.15,15,95))};
    if(P.whisper<=P.silent)P.whisper=P.silent+3;
    if(P.partner<=P.whisper)P.partner=P.whisper+3;
    S.presets=P;saveS();if(S.goal)choosePreset(S.goal);else renderPresets();
    msg.textContent=t('calDone',{a:Math.round(a),b:Math.round(b)});
  }
}

/* week view with chart */
function schoolDays(n){const out=[];const d=NOW();while(out.length<n){const wd=d.getDay();if(wd!==0&&wd!==6)out.unshift(new Date(d));d.setDate(d.getDate()-1)}return out}
function chartSvg(){
  const days=schoolDays(10),vals=days.map(d=>(totals.days[dayKey(d)]||0)/60),daily=S.weekGoal/5;
  const max=Math.max(daily*1.4,...vals,5),W0=640,H0=210,pl=8,pr=8,pt=22,pb=40,cw=(W0-pl-pr)/days.length,bw=cw*.56,y=v=>pt+(H0-pt-pb)*(1-v/max);
  const today=dayKey(NOW());
  let s=`<svg viewBox="0 0 ${W0} ${H0}" role="img" aria-label="${esc(t('chartTitle'))}">`;
  s+=`<line x1="${pl}" x2="${W0-pr}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--hair)" stroke-width="1"/>`;
  s+=`<line x1="${pl}" x2="${W0-pr}" y1="${y(daily).toFixed(1)}" y2="${y(daily).toFixed(1)}" style="stroke:var(--sun)" stroke-width="1.5" stroke-dasharray="5 5" opacity=".75"/>`;
  s+=`<text x="${pl+2}" y="${(y(daily)-6).toFixed(1)}" text-anchor="start" style="fill:var(--sun);font:700 11px var(--body)">${Math.round(daily)} min · ${esc(t('chartGoal'))}</text>`;
  days.forEach((d,i)=>{const v=vals[i],x=pl+i*cw+(cw-bw)/2,yy=y(v),isT=dayKey(d)===today;
    if(i===5)s+=`<line x1="${pl+i*cw}" x2="${pl+i*cw}" y1="${pt}" y2="${y(0)+30}" style="stroke:var(--hair)"/>`;
    s+=`<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,y(0)-yy).toFixed(1)}" rx="5" style="fill:${isT?'var(--calm)':'rgba(95,214,180,.45)'}"/>`;
    if(v>=.5)s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(yy-6).toFixed(1)}" text-anchor="middle" style="fill:var(--ink);font:800 12px var(--body)">${Math.round(v)}</text>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${y(0)+16}" text-anchor="middle" style="fill:${isT?'var(--ink)':'var(--muted)'};font:800 11px var(--body)">${esc(d.toLocaleDateString(locale(),{weekday:'short'}))}</text>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${y(0)+30}" text-anchor="middle" style="fill:var(--muted);font:600 10px var(--body)">${d.getDate()}.${d.getMonth()+1}.</text>`;});
  return s+'</svg>';
}

/* quiz */
let quiz=null;
function found(){return BIOMES.flatMap(b=>b.animals.filter(a=>rec(b.id,a.id)))}
function newQuiz(){
  const pool=shuffle(found().slice()),n=Math.min(6,pool.length);
  quiz={i:0,score:0,answered:false,qs:pool.slice(0,n).map(a=>{
    const others=shuffle(found().filter(x=>x!==a)).slice(0,3);
    if(others.length<3)shuffle(BYID(a.biome).animals.filter(x=>x!==a&&!others.includes(x))).slice(0,3-others.length).forEach(x=>others.push(x));
    return {a,opts:shuffle([a,...others])}})};
}
function renderQuiz(){
  const v=$('#quizView');v.hidden=false;
  const f=found();
  if(f.length<4){v.innerHTML=`<div class="quiz"><h3>${esc(t('quizTitle'))}</h3><p class="note" style="font-size:16px">${esc(t('quizNeed'))}</p></div>`;return}

    v.querySelector('.pic').classList.add('shadow');v.querySelector('#qStart').onclick=()=>{newQuiz();renderQuiz()};return}
  if(quiz.i>=quiz.qs.length){v.innerHTML=`<div class="quiz"><h3>${esc(t('quizTitle'))}</h3><div class="score">${esc(t('quizScore',{s:quiz.score,n:quiz.qs.length}))}</div><p></p><button class="btn primary big" id="qAgain">${esc(t('quizAgain'))}</button></div>`;
    v.querySelector('#qAgain').onclick=()=>{newQuiz();renderQuiz()};return}
  const q=quiz.qs[quiz.i];
  v.innerHTML=`<div class="quiz"><p class="note">${esc(t('quizQ',{i:quiz.i+1,n:quiz.qs.length}))}</p><h3>${esc(t('quizTitle'))}</h3><div class="pic shadow" style="--tint:${BYID(q.a.biome).tint}">${ART.svg(q.a.id)}</div><div class="opts"></div><div class="result"></div><button class="btn primary big" id="qNext" hidden>${esc(t('quizNext'))}</button></div>`;
  const opts=v.querySelector('.opts');
  q.opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=aName(o);b.onclick=()=>{
    if(quiz.answered)return;quiz.answered=true;const ok=o===q.a;if(ok)quiz.score++;
