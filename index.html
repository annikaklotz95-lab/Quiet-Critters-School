  ['whisper','#5aa8d8',I('<path d="M5 5h14a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-7l-5 4v-4H5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z"/><text x="12" y="13.6" font-size="6.4" font-weight="800" text-anchor="middle" fill="currentColor" stroke="none" font-family="Nunito,sans-serif">psst</text>')],
  ['silent','#7a6ad8',I('<circle cx="12" cy="11" r="8"/><circle cx="9" cy="9" r=".7" fill="currentColor"/><circle cx="15" cy="9" r=".7" fill="currentColor"/><path d="M9 14h6"/><path d="M12 11.5V21" stroke-width="3.2"/>')],
  ['alone','#4aa88a',I('<circle cx="12" cy="7" r="3.5"/><path d="M5.5 20v-1.5a6.5 6.5 0 0 1 13 0V20"/>')],
  ['partner','#e8a03a',I('<circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="8" r="3"/><path d="M2.5 20v-1a5.5 5.5 0 0 1 11 0v1"/><path d="M13.5 15.2a5.5 5.5 0 0 1 8.5 3.8v1"/>')],
  ['group','#d8664a',I('<circle cx="12" cy="6.5" r="2.8"/><circle cx="5.5" cy="10" r="2.4"/><circle cx="18.5" cy="10" r="2.4"/><path d="M7.5 20v-1a4.5 4.5 0 0 1 9 0v1"/><path d="M1.5 20v-.5a4 4 0 0 1 5.5-3.7"/><path d="M22.5 20v-.5a4 4 0 0 0-5.5-3.7"/>')],
  ['hand','#e86a8a',I('<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 10.5V4a1.5 1.5 0 0 1 3 0v6.5"/><path d="M14 10.5V5.5a1.5 1.5 0 0 1 3 0v6"/><path d="M17 9.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-2.7L4.3 14.5a1.6 1.6 0 0 1 2.6-1.8L8 14"/>')],
  ['listen','#3a9ab8',I('<path d="M6.5 9a5.5 5.5 0 0 1 11 0c0 3.2-3.2 4.2-3.2 7.2a3.1 3.1 0 0 1-5.8 1.6"/><path d="M9.6 9.2a2.4 2.4 0 0 1 4.8 0c0 1.6-1.6 2.1-1.6 3.6"/>')],
  ['look','#2a8a7a',I('<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>')],
  ['read','#8a6ad0',I('<path d="M3 5h6a3 3 0 0 1 3 3v12a2.5 2.5 0 0 0-2.5-2.5H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2.5 2.5 0 0 1 2.5-2.5H21z"/>')],
  ['write','#3a7ad8',I('<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="M14.5 5.5l3 3"/><path d="M12 21h8"/>')],
  ['math','#d88a2a',I('<path d="M4 7.5h6M7 4.5v6M14 7.5h6M4.5 15l5 5M9.5 15l-5 5M14 16h6M14 19.5h6"/>')],
  ['draw','#c84a9a',I('<path d="M12 3a9 9 0 0 0 0 18c1.4 0 2-1 2-2 0-1.5-1.5-1.8-1.5-3 0-1 .8-2 2-2H17a4 4 0 0 0 4-4c0-4-4-7-9-7z"/><circle cx="7.5" cy="11" r="1.3" fill="currentColor"/><circle cx="10" cy="7" r="1.3" fill="currentColor"/><circle cx="15" cy="7.5" r="1.3" fill="currentColor"/>')],
  ['tablet','#5a6a7a',I('<rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M11 18.5h2"/>')],
  ['tidy','#7a9a3a',I('<path d="M3 8l9-4 9 4-9 4z"/><path d="M3 8v8.5l9 4 9-4V8"/><path d="M12 12v8.5"/>')],
  ['snack','#d84a3a',I('<path d="M12 7.5c-2-2-7.5-1.5-7.5 4 0 5 3 9.5 5.2 9.5 1 0 1.5-.5 2.3-.5s1.3.5 2.3.5c2.2 0 5.2-4.5 5.2-9.5 0-5.5-5.5-6-7.5-4z"/><path d="M12 7.5c0-2 1-3.8 3-4.5"/>')],
  ['circle','#b8823a',I('<circle cx="12" cy="4.5" r="1.8"/><circle cx="19" cy="9.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="5" cy="9.5" r="1.8"/>')],
  ['ask','#4a8ad8',I('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7"/><circle cx="12" cy="17.2" r=".8" fill="currentColor"/>')],
  ['neighbour','#2aa0a0',I('<path d="M3 4h10v7H7.5L4 14v-3H3z"/><path d="M21 10H11v7h4.5l3.5 3v-3h2z"/>')],
  ['home','#8a5a3a',I('<path d="M3 11l9-7 9 7"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5.5h4V20"/>')],
  ['stop','#c8352a',I('<path d="M8 2.5h8l5.5 5.5v8L16 21.5H8L2.5 16V8z"/><path d="M12 7v6.5"/><circle cx="12" cy="17" r=".9" fill="currentColor"/>')]
];
const SYMBY=Object.fromEntries(SYMBOLS.map(s=>[s[0],s]));
let wdata=store.get('widgets',[]),wTop=24;
const saveW=()=>store.set('widgets',wdata);
function wDrag(el,handle,d){let sx,sy,ox,oy,on=false;
  handle.addEventListener('pointerdown',e=>{if(e.target.closest('button,select,input,[contenteditable="true"]'))return;on=true;handle.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;el.style.zIndex=++wTop;e.preventDefault()});
  handle.addEventListener('pointermove',e=>{if(!on)return;el.style.left=clamp(ox+e.clientX-sx,0,innerWidth-60)+'px';el.style.top=clamp(oy+e.clientY-sy,0,innerHeight-40)+'px'});
  handle.addEventListener('pointerup',()=>{if(!on)return;on=false;d.x=el.offsetLeft/innerWidth;d.y=el.offsetTop/innerHeight;saveW()})}
function wPlace(el,d){el.style.left=clamp(d.x*innerWidth,0,innerWidth-80)+'px';el.style.top=clamp(d.y*innerHeight,0,innerHeight-60)+'px'}
function wRemove(el,d){el.remove();wdata=wdata.filter(x=>x!==d);saveW()}

function textWidget(d){
  const el=document.createElement('div');el.className='wdg wtxt';
  el.innerHTML=`<div class="wbar"><span class="wgrip" aria-hidden="true">⠿</span><select class="wfont"></select><button data-a="-" class="wsm">A−</button><button data-a="+">A+</button><button data-a="b"><b>B</b></button><span class="wcols"></span><select class="wbg"></select><button data-a="al" class="wal"></button><button data-a="x" class="wx">×</button></div><div class="wbox"><div class="wtext" contenteditable="true" spellcheck="true"></div></div>`;
  document.body.appendChild(el);wPlace(el,d);
  const box=el.querySelector('.wbox'),tx=el.querySelector('.wtext'),fs=el.querySelector('.wfont'),bg=el.querySelector('.wbg'),cols=el.querySelector('.wcols');
  box.style.width=(d.w||Math.min(620,innerWidth*.46))+'px';
  tx.innerHTML=d.html||'';
  FONTS.forEach(([k,,n])=>{const o=document.createElement('option');o.value=k;o.textContent=n;o.style.fontFamily=FONTS.find(f=>f[0]===k)[1];fs.appendChild(o)});
  WCOLS.forEach(c=>{const b=document.createElement('button');b.className='wsw';b.dataset.c=c;b.style.background=c;cols.appendChild(b)});
  const paint=()=>{const f=FONTS.find(x=>x[0]===d.font)||FONTS[0];tx.style.fontFamily=f[1];tx.style.fontSize=d.size+'px';tx.style.color=d.color;tx.style.fontWeight=d.bold?800:500;tx.style.textAlign=d.align;
    fs.value=f[0];el.dataset.bg=d.bg;tx.dataset.ph=t('wPh');
    bg.innerHTML='';WBGS.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=t('bg_'+k);bg.appendChild(o)});bg.value=d.bg;
    cols.querySelectorAll('.wsw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===d.color));
    el.querySelector('.wal').innerHTML=I(d.align==='center'?'<path d="M5 6h14M8 12h8M5 18h14"/>':'<path d="M4 6h16M4 12h10M4 18h16"/>');
    el.querySelector('.wx').title=t('wDel');el.querySelector('[data-a="b"]').setAttribute('aria-pressed',!!d.bold)};
  el.querySelector('.wbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.c){d.color=b.dataset.c}
    const a=b.dataset.a;if(a==='+')d.size=Math.min(140,Math.round(d.size*1.15));if(a==='-')d.size=Math.max(14,Math.round(d.size/1.15));if(a==='b')d.bold=!d.bold;if(a==='al')d.align=d.align==='center'?'left':'center';
    if(a==='x'){wRemove(el,d);return}paint();saveW()});
  fs.onchange=()=>{d.font=fs.value;paint();saveW()};bg.onchange=()=>{d.bg=bg.value;const light=d.bg==='paper'||d.bg==='note';if(light&&d.color==='#ffffff')d.color='#1f2422';if(!light&&d.color==='#1f2422')d.color='#ffffff';paint();saveW()};
  let tm;tx.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{d.html=tx.innerHTML;saveW()},300)});
  tx.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text'))});
  new ResizeObserver(()=>{if(box.offsetWidth){d.w=box.offsetWidth;clearTimeout(tm);tm=setTimeout(saveW,300)}}).observe(box);
  el.addEventListener('pointerdown',()=>{el.style.zIndex=++wTop});
  wDrag(el,el.querySelector('.wbar'),d);wDrag(el,el.querySelector('.wgrip'),d);
  el._paint=paint;paint();return {el,tx};
}
function symWidget(d){
  const el=document.createElement('div');el.className='wdg wsym';
  el.innerHTML=`<div class="wbar"><span class="wgrip" aria-hidden="true">⠿</span><button data-a="edit" class="wedit"></button><button data-a="-" class="wsm">−</button><button data-a="+">+</button><button data-a="x" class="wx">×</button></div><div class="symrow"></div><div class="sympick"></div>`;
  document.body.appendChild(el);wPlace(el,d);
  const row=el.querySelector('.symrow'),pick=el.querySelector('.sympick');
  const paint=()=>{el.style.setProperty('--s',d.size+'px');
    row.innerHTML='';d.syms.forEach(k=>{const s=SYMBY[k];if(!s)return;const tile=document.createElement('div');tile.className='symt';tile.style.setProperty('--c',s[1]);tile.innerHTML=`<i>${s[2]}</i><span></span>`;tile.querySelector('span').textContent=t('sym_'+k);row.appendChild(tile)});
    if(!d.syms.length){const p=document.createElement('p');p.className='symhint';p.textContent=t('wSymHint');row.appendChild(p)}
    pick.hidden=!d.edit;el.classList.toggle('editing',!!d.edit);
    if(d.edit){pick.innerHTML='';SYMBOLS.forEach(([k,c,svg])=>{const b=document.createElement('button');b.style.setProperty('--c',c);b.setAttribute('aria-pressed',d.syms.includes(k));b.innerHTML=`<i>${svg}</i><span></span>`;b.querySelector('span').textContent=t('sym_'+k);
      b.onclick=()=>{d.syms=d.syms.includes(k)?d.syms.filter(x=>x!==k):d.syms.concat(k);saveW();paint()};pick.appendChild(b)})}
    el.querySelector('.wedit').textContent=t(d.edit?'wPickDone':'wPick');el.querySelector('.wx').title=t('wDel')};
  el.querySelector('.wbar').addEventListener('click',e=>{const a=e.target.closest('button')?.dataset.a;if(!a)return;
    if(a==='edit')d.edit=!d.edit;if(a==='+')d.size=Math.min(260,Math.round(d.size*1.2));if(a==='-')d.size=Math.max(56,Math.round(d.size/1.2));
    if(a==='x'){wRemove(el,d);return}saveW();paint()});
  el.addEventListener('pointerdown',()=>{el.style.zIndex=++wTop});
  wDrag(el,el.querySelector('.wbar'),d);wDrag(el,row,d);
  el._paint=paint;paint();return {el};
}
const wEls=[];
function mountW(d){const w=d.type==='text'?textWidget(d):symWidget(d);wEls.push(w.el);return w}
const freeY=(x0,x1)=>{let b=innerHeight*.12;document.querySelectorAll('.wdg').forEach(el=>{const r=el.getBoundingClientRect();if(r.right>x0&&r.left<x1)b=Math.max(b,r.bottom+18)});return b/innerHeight<.62?b/innerHeight:.13+(wdata.length%5)*.035};
function addText(){const n=wdata.length;const d={type:'text',x:.06,y:freeY(innerWidth*.06,innerWidth*.52),html:'',font:'andika',size:40,color:'#ffffff',bg:'glass',align:'left',bold:false};wdata.push(d);saveW();const w=mountW(d);w.tx.focus()}
function addSyms(){const n=wdata.length;const d={type:'sym',x:.55,y:freeY(innerWidth*.55,innerWidth*.95),syms:[],size:110,edit:true};wdata.push(d);saveW();mountW(d)}
$('#textBtn').onclick=addText;$('#symBtn').onclick=addSyms;
wdata.forEach(mountW);
function repaintWidgets(){document.querySelectorAll('.wdg').forEach(el=>el._paint&&el._paint())}
addEventListener('resize',()=>{document.querySelectorAll('.wdg').forEach((el,i)=>{const d=wdata[i];if(d)wPlace(el,d)})});

addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>{paint();sizeFx()},120);timers.forEach(T=>{T.el.style.left=clamp(T.el.offsetLeft,0,innerWidth-T.el.offsetWidth)+'px';T.el.style.top=clamp(T.el.offsetTop,0,innerHeight-T.el.offsetHeight)+'px'})});

/* ================= boot ================= */
if(S.goal&&S.presets[S.goal]!=null)S.threshold=S.presets[S.goal];
setThreshold(S.threshold,!!S.goal);
setBiome(biome);applyLang();updateCount();
for(let i=0;i<3;i++)spawn({demo:true});   // example animals that show what to expect; cleared when listening starts, never added to the collection
requestAnimationFrame(loop);
/* hook for automated checks: advance the simulation without waiting in real time */
window.__qc={spawn,st,S,step,BIOMES,adventState,renderGuide,get critters(){return critters},get totals(){return totals},playMoment:()=>playMoment(biome),renderScene,setBiomeId:id=>setBiome(BYID(id))};
})();
</script>
